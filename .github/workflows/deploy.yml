name: Publicar HabitKit no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Verificar configuração do GitHub Pages
        uses: actions/configure-pages@v5
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testar regras de negócio
        run: npm test
      - name: Gerar site estático
        run: npm run build
      - name: Verificar arquivos de produção
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html manifest.webmanifest sw.js src/app.js src/model.js src/alter-ego.js src/style.css public/logo.png; do
            test -s "dist/$file" || { echo "::error::Arquivo ausente ou vazio: dist/$file"; exit 1; }
          done
          find dist -type f -print
      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: ./dist
          retention-days: 7

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
